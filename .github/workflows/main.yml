name: Compilar APK Kiosco Erick

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Compilar aplicación Android
runs-on: ubuntu-latest

steps:
  - name: Descargar proyecto
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Android SDK existente
    shell: bash
    run: |
      echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

  - name: Aceptar licencias e instalar SDK
    shell: bash
    run: |
      yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Compilar APK
    run: gradle assembleDebug --stacktrace

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: Kiosco-Erick-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
