workflows:
android-apk:
name: Kiosco Erick - Generar APK
max_build_duration: 60
instance_type: linux_x2
environment:
java: 17
scripts:
- name: Compilar aplicación Android
script: |
if [ -f "./gradlew" ]; then
chmod +x ./gradlew
./gradlew assembleDebug
else
echo "No se encontró gradlew en la raíz del proyecto."
exit 1
fi
artifacts:
- app/build/outputs/apk/debug/*.apk
